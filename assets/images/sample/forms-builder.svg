<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif"><rect width="1440" height="900" fill="#f5f6f8"/><rect width="1440" height="64" fill="#ffffff"/><rect y="63" width="1440" height="1" fill="#e4e7ee"/><text x="32" y="40" font-size="18" font-weight="700" fill="#151820" text-anchor="start">upket/forms</text><text x="48" y="124" font-size="28" font-weight="700" fill="#151820" text-anchor="start">contact-form</text><text x="48" y="152" font-size="14" font-weight="400" fill="#6b7280" text-anchor="start">Endpoint ready · 3 fields</text><text x="48" y="190" font-size="14" font-weight="600" fill="#151820" text-anchor="start">Email</text><rect x="48" y="202" width="600" height="48" rx="8" fill="#ffffff" stroke="#e4e7ee"/><text x="66" y="232" font-size="15" font-weight="400" fill="#6b7280" text-anchor="start">you@example.com</text><text x="48" y="300" font-size="14" font-weight="600" fill="#151820" text-anchor="start">Name</text><rect x="48" y="312" width="600" height="48" rx="8" fill="#ffffff" stroke="#e4e7ee"/><text x="66" y="342" font-size="15" font-weight="400" fill="#6b7280" text-anchor="start">Your name</text><text x="48" y="410" font-size="14" font-weight="600" fill="#151820" text-anchor="start">Message</text><rect x="48" y="422" width="600" height="80" rx="8" fill="#ffffff" stroke="#e4e7ee"/><text x="66" y="452" font-size="15" font-weight="400" fill="#6b7280" text-anchor="start">Write something…</text><rect x="48" y="540" width="140" height="44" rx="8" fill="#2a47c4"/><text x="118" y="568" font-size="15" font-weight="600" fill="#fff" text-anchor="middle">Send</text><rect x="720" y="100" width="680" height="480" rx="12" fill="#151820"/><text x="750" y="150" font-family="Menlo,monospace" font-size="16" fill="#e5e8ee"><tspan fill="#8b93a3">&lt;!-- paste into your site --&gt;</tspan></text><text x="750" y="184" font-family="Menlo,monospace" font-size="16" fill="#e5e8ee">&lt